# Grassier Grass settings. Viewpoint's settings window (Graphics > Grass) sets all but
# growthPreview and the advanced values at the end, and overwrites what it sets; other
# saved changes here apply within a couple of seconds, game running.
#
# quality = low | medium | high | ultra
#   low     light GPUs: sparse near grass, blades to 32 squares, 4 shell layers
#   medium  the default
#   high    dense grass, blades to 48 squares, 8 shell layers
#   ultra   densest, blades to 56 squares
# The mod on or off.
enabled=true

quality=medium

# Density and draw distance as shares of the preset's (1 = as it is).
densityScale=1.00
distanceScale=1.00

# The far grass beyond the blades (shells): true or false.
farGrass=true

# Share of the density drawn under a Minecraft shader pack (those shade each blade at more cost).
shaderPackDensity=0.60

# Log the grass's GPU and CPU time to console.txt every few seconds.
timings=false

# Growth is a sandbox option (Grassier Grass page), set by the save or server.
# Preview a growth from 0 (just started) to 1 (fully overgrown); -1 follows the game.
growthPreview=-1

# Replace the game's own grass with tall tufts of blades: true or false.
replaceGameGrass=true

# Advanced: raw values overriding the preset and scales (remove the # to use one).
# tufts a square near the camera (up to 5 blades a tuft), squares at full density,
# squares the blades reach, shell layers, squares the shells reach.
#density=65
#fullDensityDistance=10
#reach=40
#shells=6
#shellReach=64
