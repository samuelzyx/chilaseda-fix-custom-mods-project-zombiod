# La cantidad, expresada como porcentaje, en la que el tamaño de los grupos de zombis puede variar respecto al valor predeterminado, tanto por encima como por debajo. Por ejemplo, con una variación del 50% y un tamaño de grupo predeterminado de 20, los grupos tendrán entre 10 y 30 zombis. Mínimo=0 Máximo=100 Por defecto=50
ZombieConfig.RallyGroupSizeVariance=50

# Distancia real que recorren los zombis para formar grupos cuando están inactivos. Mínimo=5 Máximo=50 Por defecto=20
ZombieConfig.RallyTravelDistance=20

# La distancia entre los grupos de zombies. Mínimo=5 Máximo=25 Por defecto=15
ZombieConfig.RallyGroupSeparation=15

# Cercanía que mantienen los miembros del grupo con el líder del mismo. Mínimo=1 Máximo=10 Por defecto=3
ZombieConfig.RallyGroupRadius=3

# Controla el número máximo de zombis registrados antes de que se realice la limpieza. 0 significa que los zombis no se eliminarán. Se recomienda encarecidamente el valor predeterminado (300). Aumentar este valor o establecerlo en 0 puede causar graves problemas de rendimiento. Para solucionar problemas y enviar informes de errores, reproduce cualquier problema con la configuración predeterminada antes de enviar el informe. Mínimo=0 Máximo=5000 Por defecto=300
